name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Explicitly disable Node.js detection
  NODE_VERSION: ''
  SKIP_INSTALL_SIMPLE_PROMPT: true
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
      FIREBASE_WEB_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
      FIREBASE_WEB_STORAGE_BUCKET: ${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
      FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
      FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
      FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Remove functions directory temporarily 
      run: |
        if [ -d "functions" ]; then
          mv functions functions_backup
        fi
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.6'
        channel: 'stable'
        cache: true
    
    - name: Verify Flutter installation
      run: |
        flutter doctor -v
        flutter config --no-analytics
    
    - name: Clean and get dependencies
      run: |
        flutter clean
        flutter pub get
    
    - name: Enable Flutter web
      run: flutter config --enable-web

    - name: Validate required Firebase web secrets
      run: |
        required_vars=(
          FIREBASE_WEB_API_KEY
          FIREBASE_WEB_AUTH_DOMAIN
          FIREBASE_WEB_PROJECT_ID
          FIREBASE_WEB_STORAGE_BUCKET
          FIREBASE_WEB_MESSAGING_SENDER_ID
          FIREBASE_WEB_APP_ID
        )
        missing=0
        for key in "${required_vars[@]}"; do
          if [ -z "${!key}" ]; then
            echo "::error::$key is not set."
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::Required Firebase web secrets are missing. Deployment aborted."
          exit 1
        fi
    
    - name: Build Flutter web
      run: |
        flutter build web --release --base-href "/${{ env.REPO_NAME }}/" --verbose \
          --dart-define=FIREBASE_WEB_API_KEY="${FIREBASE_WEB_API_KEY}" \
          --dart-define=FIREBASE_WEB_AUTH_DOMAIN="${FIREBASE_WEB_AUTH_DOMAIN}" \
          --dart-define=FIREBASE_WEB_PROJECT_ID="${FIREBASE_WEB_PROJECT_ID}" \
          --dart-define=FIREBASE_WEB_STORAGE_BUCKET="${FIREBASE_WEB_STORAGE_BUCKET}" \
          --dart-define=FIREBASE_WEB_MESSAGING_SENDER_ID="${FIREBASE_WEB_MESSAGING_SENDER_ID}" \
          --dart-define=FIREBASE_WEB_APP_ID="${FIREBASE_WEB_APP_ID}" \
          --dart-define=FIREBASE_WEB_MEASUREMENT_ID="${FIREBASE_WEB_MEASUREMENT_ID}"
    
    - name: Verify build output
      run: |
        ls -la build/web/
        echo "Build completed successfully"
    
    - name: Add .nojekyll file (disable Jekyll processing)
      run: touch build/web/.nojekyll
    
    - name: Copy index.html to 404.html (for SPA routing)
      run: cp build/web/index.html build/web/404.html
    
    - name: Restore functions directory
      run: |
        if [ -d "functions_backup" ]; then
          mv functions_backup functions
        fi
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './build/web'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
